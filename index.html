<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Felix Lipski</title>
    <link rel="icon" type="image/x-icon" href="icon.png" />
    <style>
      html {
        scrollbar-color: #222222 #ffffdd;
      }
      body {
        padding: 2em;
        color: #222222;
        background-color: #ffffdd;

        background-image: url(bg-ext.png);
        background-position: bottom left;
        background-attachment: fixed;
        background-repeat: repeat-x;
        max-width: calc(1042px + 2em);
        margin: 1rem auto;

        font-family: monospace;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      main {
        /* background-image: url(bg-whtie.png);
        background-position: bottom left;
        background-attachment: fixed; */
        margin: 0 1em;
        /* display: flex;
        flex-direction: column; */
      }

      iframe,
      .foo,
      section,
      .square-img,
      .wp {
        border: 1px solid #222222;
      }

      .spotify {
        width: calc(100% - 2px);
      }

      section {
        background-color: #ffffff;
        padding-left: 1em;
        padding-right: 1em;
        margin-bottom: 1em;
        position: relative;
      }

      .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 1em;
      }

      .square-img {
        max-width: calc(100% - 2px);
      }

      .wp {
        max-width: 100%;
        max-height: 512px;
        overflow-x: scroll;
        scrollbar-color: #222222 #ffffff;
        background-color: #ffffff;
      }
      .header {
        background-color: #0066ff;
        /* background-color: #4477aa; */
        color: #ffffdd;
        text-align: center;
        /* stroke-width: 1;
        stroke: #ffffff; */
      }

      .purple {
        color: #6600ff;
      }
      .blue {
        color: #0066ff;
      }
      .cyan {
        color: #00aa77;
      }
      .green,
      a {
        color: #77aa00;
      }
      .yellow {
        color: #ccbb00;
      }
      .orange {
        color: #ee6600;
      }
      .red {
        color: #cc2200;
      }
      .black {
        color: #222222;
      }
      a {
        font-weight: bold;
      }

      @keyframes stepColors {
        0% {
          color: #6600ff;
        }
        16.67% {
          color: #cc2200;
        }
        33.33% {
          color: #ee6600;
        }
        50% {
          color: #77aa00;
        }
        66.67% {
          color: #00aa77;
        }
        83.33% {
          color: #0066ff;
        }
        100% {
          color: #6600ff;
        } /* Loop back to the first color */
      }

      .stepped-color {
        animation: stepColors 1s steps(6, end) infinite;
      }

      /* .banner-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .banner-wrapper img {
        max-width: 661;
      } */
      .banner {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    
  </body>
</html>
